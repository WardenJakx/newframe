name: Release browser extension

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: Optional introduction to prepend to the generated release notes
        required: false
        default: ''
        type: string

concurrency:
  group: release-browser-extension
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare, test, and package candidate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact: ${{ steps.metadata.outputs.artifact }}
      baseline-needed: ${{ steps.previous.outputs.baseline-needed }}
      baseline-ref: ${{ steps.previous.outputs.baseline-ref }}
      candidate: ${{ steps.candidate.outputs.sha }}
      checksum: ${{ steps.metadata.outputs.checksum }}
      previous-tag: ${{ steps.previous.outputs.tag }}
      tag: ${{ steps.prep.outputs.tag }}
      transfer-artifact: ${{ steps.transfer.outputs.name }}
      version: ${{ steps.prep.outputs.version }}
    steps:
      - name: Require the exact current main commit
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Browser-extension releases must be dispatched from the main branch."
            exit 1
          fi

      - name: Check out the dispatched commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify the dispatch still targets current main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main
          if [[ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]]; then
            echo "::error::Browser-extension releases must target the exact current main commit."
            exit 1
          fi
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::The dispatched checkout is not clean."
            git status --short
            exit 1
          fi

      - name: Set up Bun
        id: bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Restore Bun package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: >-
            bun-${{ runner.os }}-${{ runner.arch }}-${{
            steps.bun.outputs.bun-version }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ runner.arch }}-${{ steps.bun.outputs.bun-version }}-

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Find the prior extension release tag
        id: previous
        shell: bash
        run: |
          set -euo pipefail
          remote_tags="$(git ls-remote --refs --tags origin 'refs/tags/extension-v*')"
          mapfile -t extension_tags < <(
            printf '%s' "$remote_tags" |
              awk '{ sub(/^refs\/tags\//, "", $2); print $2 }'
          )
          for tag in "${extension_tags[@]}"; do
            if [[ ! "$tag" =~ ^extension-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "::error::Origin contains malformed extension release tag '$tag'."
              exit 1
            fi
          done

          baseline_tag='extension-v0.0.1'
          baseline_needed=false
          baseline_ref=''
          if ((${#extension_tags[@]} == 0)); then
            previous_tag="$baseline_tag"
            baseline_needed=true
            baseline_ref="$GITHUB_SHA"
            echo "No prior extension tag exists; $baseline_tag will mark the pre-release baseline."
          else
            previous_tag="$(
              printf '%s\n' "${extension_tags[@]}" |
                LC_ALL=C sort -V |
                tail -n 1
            )"
            git fetch --no-tags origin \
              "refs/tags/$previous_tag:refs/tags/$previous_tag"
            if ! git merge-base --is-ancestor "$previous_tag" "$GITHUB_SHA"; then
              echo "::error::Prior extension tag $previous_tag is not an ancestor of dispatched main."
              exit 1
            fi
            echo "Generated notes will start after $previous_tag."
          fi

          if [[ " ${extension_tags[*]} " == *" $baseline_tag "* ]]; then
            if [[ "$previous_tag" != "$baseline_tag" ]]; then
              git fetch --no-tags origin \
                "refs/tags/$baseline_tag:refs/tags/$baseline_tag"
            fi
            if ! git merge-base --is-ancestor "$baseline_tag" "$GITHUB_SHA"; then
              echo "::error::Permanent extension baseline $baseline_tag is not an ancestor of main."
              exit 1
            fi
            baseline_ref="$(git rev-parse "refs/tags/$baseline_tag")"
          fi
          echo "baseline-needed=$baseline_needed" >> "$GITHUB_OUTPUT"
          echo "baseline-ref=$baseline_ref" >> "$GITHUB_OUTPUT"
          echo "tag=$previous_tag" >> "$GITHUB_OUTPUT"

      - name: Prepare extension release metadata
        id: prep
        env:
          RELEASE_SUMMARY: ${{ inputs.release_notes }}
        shell: bash
        run: |
          set -euo pipefail
          introduction="${RELEASE_SUMMARY//$'\r'/}"
          introduction_file="$RUNNER_TEMP/extension-release-introduction.md"
          if [[ -n "${introduction//[$' \t\n']/}" ]]; then
            printf '%s\n' "$introduction" > "$introduction_file"
          else
            : > "$introduction_file"
          fi
          bun scripts/release/prepare-release.ts extension \
            --github-output "$GITHUB_OUTPUT"

      - name: Create the exact local release commit
        id: candidate
        env:
          RELEASE_TAG: ${{ steps.prep.outputs.tag }}
          RELEASE_VERSION: ${{ steps.prep.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.prep.outputs.product }}" != "extension" ]]; then
            echo "::error::Release preparation returned the wrong product."
            exit 1
          fi
          if [[ "$RELEASE_TAG" != "extension-v$RELEASE_VERSION" ]]; then
            echo "::error::Release preparation returned inconsistent version and tag metadata."
            exit 1
          fi

          expected="$(
            printf '%s\n' \
              apps/newframe-extension/package.json \
              apps/newframe-extension/src/manifest.json
          )"
          changed="$(git diff --name-only | LC_ALL=C sort)"
          if [[ "$changed" != "$expected" ]]; then
            echo "::error::Release preparation must update exactly the extension package and manifest."
            printf 'Expected:\n%s\nActual:\n%s\n' "$expected" "${changed:-<none>}"
            exit 1
          fi
          if [[ -n "$(git ls-files --others --exclude-standard)" ]]; then
            echo "::error::Release preparation created unexpected untracked files."
            git status --short
            exit 1
          fi

          git add -- \
            apps/newframe-extension/package.json \
            apps/newframe-extension/src/manifest.json
          git -c user.name=github-actions \
            -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            -c commit.gpgsign=false \
            commit -m "release(extension): $RELEASE_VERSION"

          candidate_sha="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "sha=$candidate_sha" >> "$GITHUB_OUTPUT"

      - name: Validate committed release metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.candidate.outputs.sha }}"
          bun run --cwd apps/newframe-extension release:validate \
            --github-output "$GITHUB_OUTPUT"

      - name: Cross-check release metadata
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.metadata.outputs.version }}" = "${{ steps.prep.outputs.version }}"
          test "${{ steps.metadata.outputs.tag }}" = "${{ steps.prep.outputs.tag }}"
          test "${{ steps.metadata.outputs.artifact }}" = \
            "Newframe-Browser-Extension-${{ steps.prep.outputs.version }}.zip"
          test "${{ steps.metadata.outputs.checksum }}" = \
            "Newframe-Browser-Extension-${{ steps.prep.outputs.version }}.zip.sha256"

      - name: Test the extension
        run: bun run test:newframe-extension

      - name: Type-check the extension
        run: bun run --cwd apps/newframe-extension typecheck

      - name: Build the extension
        run: bun run build:newframe-extension

      - name: Package and verify the exact candidate
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          RELEASE_OUTPUT: ${{ runner.temp }}/extension-candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git diff --exit-code
          git diff --cached --exit-code
          mkdir -p "$RELEASE_OUTPUT"
          cp "$RUNNER_TEMP/extension-release-introduction.md" \
            "$RELEASE_OUTPUT/introduction.md"
          bun run --cwd apps/newframe-extension release:package \
            --output-dir "$RELEASE_OUTPUT"
          bun run --cwd apps/newframe-extension release:verify \
            --artifact "$RELEASE_OUTPUT/${{ steps.metadata.outputs.artifact }}" \
            --checksum "$RELEASE_OUTPUT/${{ steps.metadata.outputs.checksum }}"

      - name: Bundle the exact candidate commit
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          RELEASE_OUTPUT: ${{ runner.temp }}/extension-candidate
        shell: bash
        run: |
          set -euo pipefail
          git branch release-extension-candidate "$CANDIDATE_SHA"
          git bundle create "$RELEASE_OUTPUT/candidate.bundle" \
            refs/heads/release-extension-candidate \
            "^$GITHUB_SHA"
          git bundle verify "$RELEASE_OUTPUT/candidate.bundle"
          test "$(git rev-parse refs/heads/release-extension-candidate)" = "$CANDIDATE_SHA"

      - name: Name the candidate transfer artifact
        id: transfer
        shell: bash
        run: |
          echo "name=browser-extension-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            >> "$GITHUB_OUTPUT"

      - name: Upload candidate commit and verified assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.transfer.outputs.name }}
          path: ${{ runner.temp }}/extension-candidate
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub-signed release
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CANDIDATE_SHA: ${{ needs.prepare.outputs.candidate }}
      BASELINE_NEEDED: ${{ needs.prepare.outputs.baseline-needed }}
      BASELINE_REF: ${{ needs.prepare.outputs.baseline-ref }}
      RELEASE_ARTIFACT: ${{ needs.prepare.outputs.artifact }}
      RELEASE_CHECKSUM: ${{ needs.prepare.outputs.checksum }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      PREVIOUS_TAG: ${{ needs.prepare.outputs.previous-tag }}
    steps:
      - name: Check out the dispatched commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download the exact candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.prepare.outputs.transfer-artifact }}
          path: ${{ runner.temp }}/extension-candidate

      - name: Restore and validate the candidate commit
        env:
          TRANSFER_DIR: ${{ runner.temp }}/extension-candidate
        shell: bash
        run: |
          set -euo pipefail
          git bundle verify "$TRANSFER_DIR/candidate.bundle"
          git fetch "$TRANSFER_DIR/candidate.bundle" \
            refs/heads/release-extension-candidate
          if [[ "$(git rev-parse FETCH_HEAD)" != "$CANDIDATE_SHA" ]]; then
            echo "::error::Transferred candidate does not match the prepared commit."
            exit 1
          fi
          if [[ "$(git rev-parse "$CANDIDATE_SHA^")" != "$GITHUB_SHA" ]]; then
            echo "::error::Candidate is not a direct child of the dispatched main commit."
            exit 1
          fi

          expected="$(
            printf '%s\n' \
              apps/newframe-extension/package.json \
              apps/newframe-extension/src/manifest.json
          )"
          changed="$(git diff-tree --no-commit-id --name-only -r "$CANDIDATE_SHA" | LC_ALL=C sort)"
          if [[ "$changed" != "$expected" ]]; then
            echo "::error::Candidate commit contains files outside the extension release metadata."
            printf 'Expected:\n%s\nActual:\n%s\n' "$expected" "${changed:-<none>}"
            exit 1
          fi
          git checkout --detach "$CANDIDATE_SHA"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Revalidate candidate source and assets
        env:
          TRANSFER_DIR: ${{ runner.temp }}/extension-candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(jq -er '.version' apps/newframe-extension/package.json)" = "$RELEASE_VERSION"
          test "$(jq -er '.version' apps/newframe-extension/src/manifest.json)" = "$RELEASE_VERSION"
          bun run --cwd apps/newframe-extension release:validate
          bun run --cwd apps/newframe-extension release:verify \
            --artifact "$TRANSFER_DIR/$RELEASE_ARTIFACT" \
            --checksum "$TRANSFER_DIR/$RELEASE_CHECKSUM"
          test -f "$TRANSFER_DIR/introduction.md"

      - name: Compose notes to prepend to generated notes
        env:
          TRANSFER_DIR: ${{ runner.temp }}/extension-candidate
        shell: bash
        run: |
          set -euo pipefail
          prepended_notes="$RUNNER_TEMP/extension-prepended-notes.md"

          if grep -q '[^[:space:]]' "$TRANSFER_DIR/introduction.md"; then
            {
              printf '%s\n\n' '## Introduction'
              while IFS= read -r line || [[ -n "$line" ]]; do
                printf '%s\n' "$line"
              done < "$TRANSFER_DIR/introduction.md"
              printf '\n'
            } > "$prepended_notes"
          else
            : > "$prepended_notes"
          fi

          {
            printf '%s\n\n' '## Install'
            printf '%s\n\n' \
              'This is an unpacked developer extension and requires the Newframe desktop app to be running.'
            printf '%s\n' \
              '- Chrome, Brave, and Chromium: verify the SHA-256 file, extract the ZIP, enable Developer mode on the extensions page, and load the extracted directory with **Load unpacked**.'
            printf '%s\n\n' \
              '- Firefox: verify and extract the ZIP, then open `about:debugging#/runtime/this-firefox`, choose **Load Temporary Add-on…**, and select `manifest.json`.'
            printf '%s\n' \
              'Firefox installation is temporary only: Firefox removes the extension when the browser restarts. This release is not distributed through a browser extension store.'
          } >> "$prepended_notes"

          if ! grep -Fqx '## Install' "$prepended_notes"; then
            echo "::error::Required extension installation guidance is missing."
            exit 1
          fi

      - name: Validate remote state
        id: remote
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Browser-extension releases must be dispatched from main."
            exit 1
          fi

          release_status="$(
            curl --silent --show-error \
              --output "$RUNNER_TEMP/extension-release-response.json" \
              --write-out "%{http_code}" \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG"
          )"
          case "$release_status" in
            404) ;;
            200)
              echo "::error::Release $RELEASE_TAG already exists; refusing to overwrite it."
              exit 1
              ;;
            *)
              echo "::error::Could not verify release absence (GitHub returned HTTP $release_status)."
              exit 1
              ;;
          esac

          main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          tag_sha="$(git ls-remote --refs --tags origin "refs/tags/$RELEASE_TAG" | awk '{print $1}')"
          baseline_tag='extension-v0.0.1'
          baseline_sha="$(
            git ls-remote --refs --tags origin "refs/tags/$baseline_tag" |
              awk '{print $1}'
          )"
          baseline_push_needed=false
          if [[ "$BASELINE_NEEDED" == "true" ]]; then
            if [[ -z "$baseline_sha" ]]; then
              baseline_push_needed=true
            elif [[ "$baseline_sha" != "$BASELINE_REF" ]]; then
              echo "::error::Permanent extension baseline $baseline_tag already points elsewhere."
              echo "Expected $BASELINE_REF; found $baseline_sha."
              exit 1
            fi
          elif [[ -n "$BASELINE_REF" && "$baseline_sha" != "$BASELINE_REF" ]]; then
            echo "::error::Permanent extension baseline $baseline_tag moved or disappeared."
            echo "Expected $BASELINE_REF; found ${baseline_sha:-<absent>}."
            exit 1
          fi

          remote_previous="$(
            git ls-remote --refs --tags origin 'refs/tags/extension-v*' |
              awk -v current="$RELEASE_TAG" '{
                sub(/^refs\/tags\//, "", $2)
                if ($2 != current) print $2
              }' |
              LC_ALL=C sort -V |
              tail -n 1
          )"
          if [[ "$baseline_push_needed" == "true" && -z "$remote_previous" ]]; then
            :
          elif [[ "$remote_previous" != "$PREVIOUS_TAG" ]]; then
            echo "::error::The prior extension tag changed during release preparation."
            echo "Expected ${PREVIOUS_TAG:-<none>}; found ${remote_previous:-<none>}."
            exit 1
          fi
          echo "baseline-push-needed=$baseline_push_needed" >> "$GITHUB_OUTPUT"
          if [[ "$main_sha" = "$GITHUB_SHA" && -z "$tag_sha" ]]; then
            echo "commit-needed=true" >> "$GITHUB_OUTPUT"
            echo "tag-needed=true" >> "$GITHUB_OUTPUT"
          elif [[ "$main_sha" != "$GITHUB_SHA" && -z "$tag_sha" ]]; then
            echo "commit-needed=false" >> "$GITHUB_OUTPUT"
            echo "tag-needed=true" >> "$GITHUB_OUTPUT"
            echo "Recovering the GitHub-signed commit before creating its release tag."
          elif [[ "$main_sha" != "$GITHUB_SHA" && "$tag_sha" = "$main_sha" ]]; then
            echo "commit-needed=false" >> "$GITHUB_OUTPUT"
            echo "tag-needed=false" >> "$GITHUB_OUTPUT"
            echo "GitHub-signed main and release tag already exist; resuming publication."
          else
            echo "::error::Remote state changed or contains a partial/conflicting extension release."
            echo "Actual main/tag: ${main_sha:-<absent>}/${tag_sha:-<absent>}"
            exit 1
          fi
          echo "main-sha=$main_sha" >> "$GITHUB_OUTPUT"

      - name: Create or recover the GitHub-signed release commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.remote.outputs.commit-needed }}" == "true" ]]; then
            release_commit="$(
              bash scripts/release/create-github-signed-commit.sh \
                "$GITHUB_REPOSITORY" \
                main \
                "$GITHUB_SHA" \
                "release(extension): $RELEASE_VERSION" \
                apps/newframe-extension/package.json \
                apps/newframe-extension/src/manifest.json
            )"
          else
            release_commit="${{ steps.remote.outputs.main-sha }}"
          fi

          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "$release_commit"
          test "$(git rev-parse "$release_commit^")" = "$GITHUB_SHA"
          test "$(git rev-parse "$release_commit^{tree}")" = \
            "$(git rev-parse "$CANDIDATE_SHA^{tree}")"
          test "$(
            gh api "repos/$GITHUB_REPOSITORY/commits/$release_commit" \
              --jq '
                select(.author.login == "github-actions[bot]") |
                select(.commit.verification.verified == true) |
                select(.commit.verification.reason == "valid") |
                .sha
              '
          )" = "$release_commit"

          echo "RELEASE_COMMIT_SHA=$release_commit" >> "$GITHUB_ENV"

      - name: Push release tag and comparison baseline
        if: >-
          steps.remote.outputs.tag-needed == 'true' ||
          steps.remote.outputs.baseline-push-needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          push_options=(--atomic)
          refspecs=()
          if [[ "${{ steps.remote.outputs.tag-needed }}" == "true" ]]; then
            git tag "$RELEASE_TAG" "$RELEASE_COMMIT_SHA"
            refspecs+=("refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG")
          fi
          if [[ "${{ steps.remote.outputs.baseline-push-needed }}" == "true" ]]; then
            baseline_tag='extension-v0.0.1'
            if git show-ref --verify --quiet "refs/tags/$baseline_tag"; then
              test "$(git rev-parse "refs/tags/$baseline_tag")" = "$BASELINE_REF"
            else
              git tag "$baseline_tag" "$GITHUB_SHA"
            fi
            refspecs+=("refs/tags/$baseline_tag:refs/tags/$baseline_tag")
          fi
          git push "${push_options[@]}" origin "${refspecs[@]}"

      - name: Verify published refs
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          tag_sha="$(git ls-remote --refs --tags origin "refs/tags/$RELEASE_TAG" | awk '{print $1}')"
          baseline_sha="$(
            git ls-remote --refs --tags origin refs/tags/extension-v0.0.1 |
              awk '{print $1}'
          )"
          test "$main_sha" = "$RELEASE_COMMIT_SHA"
          test "$tag_sha" = "$RELEASE_COMMIT_SHA"
          test "$baseline_sha" = "$BASELINE_REF"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TRANSFER_DIR: ${{ runner.temp }}/extension-candidate
        shell: bash
        run: |
          set -euo pipefail
          release_args=(
            "$RELEASE_TAG"
            "$TRANSFER_DIR/$RELEASE_ARTIFACT"
            "$TRANSFER_DIR/$RELEASE_CHECKSUM"
            --repo "$GITHUB_REPOSITORY"
            --verify-tag
            --title "Newframe Browser Extension v$RELEASE_VERSION"
            --notes-file "$RUNNER_TEMP/extension-prepended-notes.md"
            --generate-notes
            --latest=false
          )
          if [[ ! "$PREVIOUS_TAG" =~ ^extension-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Generated-note comparison tag must belong to the extension track."
            exit 1
          fi
          release_args+=(--notes-start-tag "$PREVIOUS_TAG")
          gh release create "${release_args[@]}"
